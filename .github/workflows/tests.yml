name: Tests
on: [push, pull_request]
jobs:
  offline-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: python -m pip install -e '.[test]'
      - run: python -m spacy download en_core_web_sm
      - run: python -m pytest -q
      - run: python -m compileall -q backend/src backend/scripts backend/tests backend/main.py
      - run: node --check frontend/app.js
      - run: node frontend/tests/test_workflow_canvas.cjs
      - run: node --check frontend/subjects.js
      - run: node frontend/tests/test_subject_workflows.cjs
      - run: node frontend/tests/test_replay.cjs
      - run: python -m pip check

  web:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/web
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: apps/web/package-lock.json
      - run: python -m pip install -e '../..[test]'
      - run: python -m spacy download en_core_web_sm
      - run: npm ci
      - run: npm run lint
      - run: npm run build
        env:
          NEXT_TELEMETRY_DISABLED: '1'
      - run: npm run typecheck
      - run: google-chrome --version
      - run: npm test
        env:
          RESEARCHOS_CHROME: /usr/bin/google-chrome
      - run: docker compose --project-directory ../.. -f ../../docker-compose.yml config --quiet
