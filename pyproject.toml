[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"
[project]
name = "aura-model-infrastructure"
version = "0.1.0"
requires-python = ">=3.12"
dependencies = [
  "defusedxml>=0.7,<1",
  "langgraph==1.2.19", "langgraph-checkpoint-sqlite==3.1.3",
  "langchain-core==1.7.3",
  "qdrant-client==1.20.0", "pymupdf==1.28.2", "spacy==3.8.18", "python-multipart==0.0.33", "httpx==0.28.1", "pydantic==2.13.5", "pydantic-settings==2.16.2", "fastapi==0.162.0", "psutil==7.2.2", "uvicorn>=0.30,<1"]
[project.optional-dependencies]
observability = ["opentelemetry-api>=1,<2", "opentelemetry-distro>=0.50b0", "opentelemetry-exporter-otlp>=1,<2"]
nlp-bench = ["scikit-learn>=1.5,<2", "sentence-transformers>=5,<6"]
test = ["pytest==9.1.1"]
[tool.setuptools.packages.find]
where = ["backend/src"]
namespaces = true
[tool.pytest.ini_options]
pythonpath = ["backend/src"]
testpaths = ["backend/tests"]

[tool.setuptools.data-files]
"share/aura/frontend" = ["frontend/index.html", "frontend/styles.css", "frontend/app.js", "frontend/subjects.js"]
